[package]
name = "eod-charting-platform-shell"
version = "0.1.0"
description = "Fresh Tauri 2 shell for the active EOD Charting Platform frontend"
authors = ["Codex"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
csv = "1.4.0"
open = "5.3.3"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "cookies", "rustls-tls"] }
rfd = "0.15.4"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.10"
tauri = { version = "2.11.5", features = ["test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

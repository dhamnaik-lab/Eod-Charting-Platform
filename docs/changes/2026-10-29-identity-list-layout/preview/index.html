<!doctype html><html><head><meta charset="utf-8"><title>Identity list layout verification</title><style>
:root { --text:#172235;--text-dim:#526176;--border:#ccd7e4;--bg:#fff;--bg2:#f4f7fb;--control-bg:#fff;--control-bg-hover:#eaf1ff;--accent:#0067c0;--green:#00875a;--red:#bd2525; }
body { margin:0;background:#e6ebf1;font:12px 'Segoe UI',sans-serif } .fixture-controls { padding:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap; } .fixture-frame { display:flex;background:var(--bg2);transform-origin:top left; } input { box-sizing:border-box;min-width:0;font:inherit;border:1px solid var(--border) } button,select { font:inherit } .fixture-header { display:flex;align-items:center;justify-content:space-between;gap:12px; } .fixture-selectors { display:flex;align-items:center;gap:6px; } .fixture-search { display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center; } .fixture-counts { display:flex;gap:5px;flex-wrap:wrap; } .fixture-counts span { padding:3px 7px;border:1px solid var(--border);background:white; }
</style></head><body><div id="root"></div><script type="module" src="./preview.tsx"></script></body></html>

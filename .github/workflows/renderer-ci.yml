name: Renderer CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer:
    name: Renderer tests, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        id: dependencies
        run: npm ci

      # Gather a full baseline: continue to the other checks even if one fails.
      # A failed step still makes the job fail; no continue-on-error is used.
      - name: Renderer Vitest
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test

      - name: Renderer TypeScript typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck:renderer

      - name: Renderer Vite build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build:renderer

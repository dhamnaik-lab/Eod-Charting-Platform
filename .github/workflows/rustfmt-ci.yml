name: Rust Scanner Rustfmt CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri-shell/src/scanner_*.rs'
      - 'src-tauri-shell/src/native_scanner/**/*.rs'
      - '.github/workflows/rustfmt-ci.yml'

permissions:
  contents: read

jobs:
  scanner-rustfmt:
    name: Rustfmt (scanner and native scanner modules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure stable Rustfmt is available
        run: rustup component add rustfmt --toolchain stable

      - name: Check every scanner Rust module without modifying sources
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # NS-01..NS-04 live under src-tauri-shell/src/native_scanner/; the accepted
          # scanner_*.rs modules stay covered exactly as before.
          native_files=(src-tauri-shell/src/native_scanner/**/*.rs)
          scanner_files=(src-tauri-shell/src/scanner_*.rs "${native_files[@]}")
          if (( ${#scanner_files[@]} == 0 )); then
            echo 'No scanner Rust modules found; expected scanner sources are missing.' >&2
            exit 1
          fi
          printf 'Checking %d scanner Rust module(s):\n' "${#scanner_files[@]}"
          printf '  %s\n' "${scanner_files[@]}"
          rustup run stable rustfmt --edition 2021 --check "${scanner_files[@]}"

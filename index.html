<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EOD Chart</title>
    <script src="/theme-boot.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Pre-CSS paint colour. Keeps the window background aligned with the theme
         family so launching in a light theme does not flash a dark surface. */
      html,
      body {
        margin: 0;
        background: #070b10;
      }
      html[data-theme="classic-light"],
      html[data-theme="classic-light-refined"],
      html[data-theme="deep-light"] {
        background: #f3f4f6;
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
